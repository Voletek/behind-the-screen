name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Repository integrity (includes, links, agent resources, hooks, steering, skills, JSON, system profiles)
        run: python3 tools/check-repo.py

      - name: Validate example campaigns and one-shots (no FAIL allowed)
        run: python3 tools/validate-campaign.py examples/

      - name: Validate user campaigns and one-shots (no FAIL allowed)
        run: python3 tools/validate-campaign.py campaigns/ oneshots/

      - name: Bundle smoke test (every system)
        run: |
          for s in $(ls systems); do
            if [ -f "systems/$s/profile.json" ]; then
              python3 tools/build-bundle.py --system "$s" --lean > /dev/null
            fi
          done

      - name: Dice smoke test
        run: |
          python3 tools/roll.py "1d20+5" --dc 15
          python3 tools/roll.py "5d6>=4!" --ob 3
          python3 tools/roll.py "pbta+2"
          python3 tools/roll.py "d616+3" --tn 15 --edge 1
          python3 tools/roll.py "1d100" --under 45
